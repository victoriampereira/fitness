<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fitness">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter:wght@500;600&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: duas páginas (Semana em lista de dias / Mês em calendário de quadrinhos) sobre fundo grafite; toque no dia abre a folha de lançamento */
:root{
  --bg:#FFFFFF; --ink:#141414; --muted:#8A8A8A; --line:#ECECEC; --soft:#F4F4F4;
  --fill:#141414; --fill-ink:#FFFFFF;
  --inf:#E5484D; --sup:#3E7BFA; --abd:#2FA36B; --run:#F26B1D; --esc:#8B5CF6;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --label:"Inter","Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding-block:24px 64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:var(--font)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lbl{font-size:12px;font-weight:500;color:var(--muted)}
.lbl::first-letter{text-transform:uppercase}
.note{font-size:12px;color:var(--muted);text-align:center}

/* topo + abas */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:2px}
.streak{display:flex;align-items:center;gap:5px;font-weight:600;font-size:14px;white-space:nowrap}
.streak svg{width:14px;height:14px;color:var(--run)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:99px;padding:4px}
.tab{border:none;background:none;color:var(--muted);border-radius:99px;padding:9px;font-size:14px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--fill);color:var(--fill-ink)}

/* ícones */
.ic{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-grid;place-items:center;flex:none}
.ic svg{width:8.5px;height:8.5px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ic.md{width:24px;height:24px}.ic.md svg{width:15px;height:15px;stroke-width:2}
.ic.lg{width:30px;height:30px}.ic.lg svg{width:18px;height:18px;stroke-width:1.9}

/* cabeçalho de período */
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.nav{display:flex;gap:2px}
.nav button{width:34px;height:34px;border-radius:50%;border:none;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.nav button:disabled{opacity:.25;cursor:default}
.nav svg{width:16px;height:16px}

/* resumo */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid var(--line);padding-top:14px}
.sum.three{grid-template-columns:repeat(3,1fr)}
.sum div{min-width:0}
.sum b{display:block;font-size:24px;font-weight:600;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.sum b small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.sum span{font-size:11px;color:var(--muted);display:block;margin-top:5px}

/* semana: lista de dias */
.days{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.day{all:unset;box-sizing:border-box;display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.day:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.day .dn{font-size:22px;font-weight:600;line-height:1;letter-spacing:-.03em}
.day .dw{font-size:11px;color:var(--muted);margin-top:2px}
.day.today .dw{color:var(--ink);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;min-width:0}
.act{display:flex;align-items:center;gap:7px;font-family:var(--label);font-size:14px;font-weight:500;white-space:nowrap}
.rest{font-size:13px;color:var(--muted)}
.add{width:32px;height:32px;border:1.5px dashed var(--muted);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:20px;font-weight:500;line-height:1}

/* mês: calendário */
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{margin-bottom:6px}
.dow span{text-align:center;font-size:11px;font-weight:500;color:var(--muted)}
.tile{min-height:58px;max-width:100%;border:none;background:var(--soft);border-radius:10px;padding:5px 3px 5px 4px;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--ink);text-align:left;min-width:0;transition:transform .12s}
.tile:active{transform:scale(.94)}
.tile.blank{visibility:hidden}
.tile.future{background:none;color:var(--line);cursor:default}
.tile.done{background:var(--fill);color:var(--fill-ink)}
.tile.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tile.today.done{box-shadow:inset 0 0 0 1.5px var(--fill),0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.tile .n{font-size:12px;font-weight:600;line-height:1}
.marks{display:flex;flex-wrap:wrap;gap:1.5px}
.mt{display:flex;flex-direction:column;gap:2px;min-width:0}
.val{display:flex;align-items:center;gap:1.5px;min-width:0}
.val .ic{width:11px;height:11px}.val .ic svg{width:8px;height:8px}
.km{font-size:8.5px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;letter-spacing:-.02em}
.chipsum{display:flex;flex-wrap:wrap;gap:8px}
.chipsum>span{display:flex;align-items:center;gap:7px;background:var(--soft);border-radius:99px;padding:4px 12px 4px 4px;font-family:var(--label);font-size:13px;font-weight:500}

/* folha do dia */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:24px 24px 0 0;max-width:520px;margin:0 auto;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:18px;max-height:92%;overflow-y:auto;border-top:1px solid var(--line)}
.sheet{visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:4px;border-radius:9px;background:var(--line);margin:0 auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-h h3{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sh-h h3::first-letter{text-transform:uppercase}
.x{border:none;background:var(--soft);color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.toggles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tg{border:none;background:var(--soft);color:var(--ink);border-radius:14px;padding:14px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--label);font-weight:600;font-size:13px;line-height:1.15;text-align:center;min-width:0;transition:background .15s,color .15s}
.tg .ic{opacity:.5;transition:opacity .15s}
.tg[aria-pressed="true"]{background:var(--fill);color:var(--fill-ink)}
.tg[aria-pressed="true"] .ic{opacity:1}
.tg small{font-family:var(--font);font-weight:500;opacity:.55;font-size:11px}
.meter{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.meter-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meter-h strong{display:flex;align-items:center;gap:8px;font-family:var(--label);font-size:15px;font-weight:600}
.meter-h span{font-size:12px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:10px}
.st{width:42px;height:42px;flex:none;border-radius:50%;border:none;background:var(--soft);color:var(--ink);font-size:20px;font-weight:500;cursor:pointer}
.ctl input{flex:1;min-width:0;text-align:right;font:600 36px/1 var(--font);letter-spacing:-.04em;border:none;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.ctl input::-webkit-outer-spin-button,.ctl input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl em{font-style:normal;font-weight:500;color:var(--muted);font-size:14px;width:30px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.chip.zero{color:var(--muted)}
.save{border:none;border-radius:99px;background:var(--fill);color:var(--fill-ink);padding:16px;font-size:15px;font-weight:700;cursor:pointer}
.err{color:var(--inf);font-size:13px;text-align:center;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--fill);color:var(--fill-ink);border-radius:99px;padding:11px 18px;font-weight:600;font-size:13px;z-index:40;transition:transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 40px);text-align:center}
.toast{visibility:hidden}.toast.show{transform:translate(-50%,0);visibility:visible}
@media (max-width:370px){.sum b{font-size:20px}.km{font-size:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.auth{display:flex;flex-direction:column;gap:12px}
.auth input{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:14px;font:500 16px var(--font);min-width:0}
.auth .row2{display:flex;gap:10px;flex-wrap:wrap}
.auth .row2 button{flex:1}
.ghost{border:1px solid var(--line);border-radius:99px;background:none;color:var(--ink);padding:15px;font-size:15px;font-weight:700;cursor:pointer}
.msg{font-size:13px;color:var(--muted);min-height:1.2em;margin:0}
.msg.err{color:var(--inf)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.foot button{border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;padding:6px 0}
</style>
</head>
<body>

<div class="wrap" id="auth" hidden>
  <div><div class="lbl">Seu diário de treinos</div><h1 style="font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:2px">Fitness</h1></div>
  <p class="msg" style="font-size:14px">Entre com o mesmo e-mail e senha do Casa Nova.</p>
  <form class="auth" id="authForm" autocomplete="on">
    <input id="authEmail" type="email" placeholder="Seu e-mail" autocomplete="email" required aria-label="E-mail">
    <input id="authPass" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password" minlength="6" required aria-label="Senha">
    <div class="row2"><button class="save" type="submit">Entrar</button><button class="ghost" type="button" id="btnSignup">Criar conta</button></div>
    <p class="msg" id="authMsg" role="status"></p>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header class="top">
    <div><div class="lbl" id="hoje">Hoje</div><h1>Fitness</h1></div>
    <div class="streak" title="Dias seguidos com treino"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.4 1-4 2.5-5.5C9.8 9.6 11 10.5 11.5 12 13 9.5 11.5 5 12 2z"/></svg><span id="streak-n">0 dias</span></div>
  </header>

  <div class="tabs" role="tablist" aria-label="Visão">
    <button class="tab" role="tab" id="tab-sem" aria-selected="true" aria-controls="pg-sem">Semana</button>
    <button class="tab" role="tab" id="tab-mes" aria-selected="false" aria-controls="pg-mes">Mês</button>
  </div>

  <section id="pg-sem" role="tabpanel" aria-labelledby="tab-sem" style="display:flex;flex-direction:column;gap:20px">
    <div class="ph"><h2 id="sem-t">Esta semana</h2>
      <div class="nav"><button id="w-prev" aria-label="Semana anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><button id="w-next" aria-label="Próxima semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    </div>
    <div class="sum">
      <div><b id="w-km">0</b><span>corrida</span></div>
      <div><b id="w-esc">0</b><span>escada</span></div>
      <div><b id="w-mus">0</b><span>musculação</span></div>
      <div><b id="w-abd">0</b><span>abdômen</span></div>
    </div>
    <div class="days" id="days"></div>
  </section>

  <section id="pg-mes" role="tabpanel" aria-labelledby="tab-mes" hidden style="flex-direction:column;gap:20px">
    <div class="ph"><h2 id="mes-t">Outubro</h2>
      <div class="nav"><button id="m-prev" aria-label="Mês anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><button id="m-next" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    </div>
    <div>
      <div class="dow"><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span><span>D</span></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="sum three">
      <div><b id="m-dias">0</b><span>dias treinados</span></div>
      <div><b id="m-km">0</b><span>corrida no mês</span></div>
      <div><b id="m-esc">0</b><span>escada no mês</span></div>
    </div>
    <div class="chipsum" id="m-chips"></div>
  </section>

  <p class="note" id="sync">Carregando seus treinos…</p>
  <div class="foot"><span id="who"></span><button type="button" id="btnLogout">Sair</button></div>
</div>

<div class="scrim" id="scrim"></div>
<form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" novalidate aria-hidden="true">
  <div class="grab"></div>
  <div class="sh-h"><h3 id="sh-t">Hoje</h3><button type="button" class="x" id="close" aria-label="Fechar">×</button></div>
  <div class="toggles">
    <button type="button" class="tg" id="tg-inf" aria-pressed="false"><span data-ic="inf" data-sz="lg"></span>Inferiores<small>musculação</small></button>
    <button type="button" class="tg" id="tg-sup" aria-pressed="false"><span data-ic="sup" data-sz="lg"></span>Superiores<small>musculação</small></button>
    <button type="button" class="tg" id="tg-abd" aria-pressed="false"><span data-ic="abd" data-sz="lg"></span>Abdômen<small>core</small></button>
  </div>
  <div class="meter">
    <div class="meter-h"><strong><span data-ic="run" data-sz="md"></span>Corrida</strong><span>0 = não corri</span></div>
    <div class="ctl"><button type="button" class="st" data-f="km" data-s="-0.5" aria-label="Menos meio km">−</button><input id="in-km" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Quilômetros corridos"><em>km</em><button type="button" class="st" data-f="km" data-s="0.5" aria-label="Mais meio km">+</button></div>
    <div class="chips" data-f="km"><button type="button" class="chip zero" data-v="0">Não corri</button><button type="button" class="chip" data-v="3">3 km</button><button type="button" class="chip" data-v="5">5 km</button><button type="button" class="chip" data-v="8">8 km</button><button type="button" class="chip" data-v="10">10 km</button></div>
  </div>
  <div class="meter">
    <div class="meter-h"><strong><span data-ic="esc" data-sz="md"></span>Escada</strong><span>0 = não fiz</span></div>
    <div class="ctl"><button type="button" class="st" data-f="esc" data-s="-1" aria-label="Menos 1 minuto">−</button><input id="in-esc" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Minutos de escada"><em>min</em><button type="button" class="st" data-f="esc" data-s="1" aria-label="Mais 1 minuto">+</button></div>
    <div class="chips" data-f="esc"><button type="button" class="chip zero" data-v="0">Não fiz</button><button type="button" class="chip" data-v="10">10 min</button><button type="button" class="chip" data-v="15">15 min</button><button type="button" class="chip" data-v="20">20 min</button><button type="button" class="chip" data-v="30">30 min</button></div>
  </div>
  <div class="err" id="err"></div>
  <button type="submit" class="save" id="save">Salvar dia</button>
</form>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);return addDays(x,-((x.getDay()+6)%7))};
const nf=v=>Number(v||0).toLocaleString("pt-BR",{maximumFractionDigits:2,useGrouping:false});
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

let days={};
let store=null,col=null;
let page="sem";
let wStart=mondayOf(today0());
let view=new Date(today0().getFullYear(),today0().getMonth(),1);
let editing=null;

const DUMB='<g transform="rotate(-45 12 12)"><path d="M7.5 12h9"/><rect x="4" y="8" width="3.5" height="8" rx="1.2"/><rect x="16.5" y="8" width="3.5" height="8" rx="1.2"/><path d="M2 10.5v3M22 10.5v3"/></g>';
const SVG={
  inf:DUMB, sup:DUMB,
  abd:'<path d="M3 7.5l3-3 3 3 3-3 3 3 3-3 3 3M3 13.5l3-3 3 3 3-3 3 3 3-3 3 3M3 19.5l3-3 3 3 3-3 3 3 3-3 3 3"/>',
  run:'<path d="M3 17.5h16.8c.9 0 1.5-.9 1.1-1.7-.6-1.1-1.6-1.8-2.9-2.1l-3.5-.8-3.2-5.4c-.3-.5-1-.7-1.5-.3l-2 1.4.7 2.1-2.4.6-1.3-2.4-1.9 1.2c-.6.4-.9 1.1-.7 1.8z"/><path d="M3 15h5M11.5 11.2l1.6-.6M12.8 13.3l1.6-.6"/>',
  esc:'<path d="M3 20h5v-5h5v-5h5V5h3"/>'
};
const NAME={inf:"Inferiores",sup:"Superiores",abd:"Abdômen"};
const ic=(t,sz)=>'<span class="ic'+(sz?' '+sz:'')+'" style="--c:var(--'+t+')" aria-hidden="true"><svg viewBox="0 0 24 24">'+SVG[t]+'</svg></span>';
document.querySelectorAll("[data-ic]").forEach(el=>{el.outerHTML=ic(el.dataset.ic,el.dataset.sz)});
const active=d=>!!d&&(d.inf||d.sup||d.abd||d.km>0||d.esc>0);

const SUPABASE_URL="https://ufbmhikchqhstcbhioib.supabase.co";
const SUPABASE_KEY="sb_publishable_QGj4aoHhWZXbCUBep2tylA_a8NckDy7";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let session=null,channel=null;
try{const p=localStorage.getItem("fitness-pagina");if(p==="mes")page="mes"}catch(e){}

async function reload(){
  if(!session)return;
  const {data,error}=await sb.from("fitness_dias").select("dia,inf,sup,abd,km,esc");
  if(error){console.error(error);$("sync").textContent="Não foi possível carregar seus treinos. Verifique a internet.";return}
  const m={};data.forEach(r=>{m[r.dia]={inf:r.inf,sup:r.sup,abd:r.abd,km:Number(r.km)||0,esc:Number(r.esc)||0}});
  days=m;$("sync").textContent="Toque em um dia para lançar o que você fez.";render();
}
let rt=null;const reloadSoon=()=>{clearTimeout(rt);rt=setTimeout(reload,250)};
function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("fitness-"+session.user.id).on("postgres_changes",{event:"*",schema:"public",table:"fitness_dias",filter:"user_id=eq."+session.user.id},reloadSoon).subscribe();
}
async function setSession(s){
  const changed=(s?.user?.id)!==(session?.user?.id);session=s;
  $("auth").hidden=!!session;$("app").hidden=!session;
  if(!session){if(channel){sb.removeChannel(channel);channel=null}days={};return}
  $("who").textContent=session.user.email||"";
  if(changed){render();await reload();subscribe()}
}
async function saveDay(k,d){
  if(active(d)){const {error}=await sb.from("fitness_dias").upsert({user_id:session.user.id,dia:k,...d,updated_at:new Date().toISOString()});if(error)throw error;days[k]=d}
  else{const {error}=await sb.from("fitness_dias").delete().eq("user_id",session.user.id).eq("dia",k);if(error)throw error;delete days[k]}
  render();
}
function streak(){let d=today0(),n=0;if(!active(days[key(d)]))d=addDays(d,-1);while(active(days[key(d)])){n++;d=addDays(d,-1)}return n}

function actsHTML(v){
  const a=[];
  ["inf","sup","abd"].forEach(k=>{if(v[k])a.push('<span class="act">'+ic(k,"md")+NAME[k]+'</span>')});
  if(v.km>0)a.push('<span class="act">'+ic("run","md")+nf(v.km)+' km</span>');
  if(v.esc>0)a.push('<span class="act">'+ic("esc","md")+nf(v.esc)+' min</span>');
  return a.join("");
}

function render(){
  const t=today0(),tk=key(t);
  $("hoje").textContent=t.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  const s=streak();$("streak-n").textContent=s+(s===1?" dia seguido":" dias seguidos");
  $("tab-sem").setAttribute("aria-selected",String(page==="sem"));$("tab-mes").setAttribute("aria-selected",String(page==="mes"));
  $("pg-sem").hidden=page!=="sem";$("pg-mes").hidden=page!=="mes";$("pg-mes").style.display=page==="mes"?"flex":"";

  /* semana */
  const wk=[...Array(7)].map((_,i)=>addDays(wStart,i));
  const W=wk.map(d=>days[key(d)]||{});
  const isCur=key(wStart)===key(mondayOf(t));
  $("sem-t").textContent=isCur?"Esta semana":wk[0].getDate()+" – "+wk[6].toLocaleDateString("pt-BR",{day:"numeric",month:"short"});
  $("w-next").disabled=isCur;
  $("w-km").innerHTML=nf(W.reduce((a,d)=>a+(+d.km||0),0))+"<small>km</small>";
  $("w-esc").innerHTML=nf(W.reduce((a,d)=>a+(+d.esc||0),0))+"<small>min</small>";
  $("w-mus").innerHTML=W.filter(d=>d.inf||d.sup).length+"<small>dias</small>";
  $("w-abd").innerHTML=W.filter(d=>d.abd).length+"<small>dias</small>";
  $("days").innerHTML=wk.filter(d=>d<=t).reverse().map(d=>{const k=key(d),v=days[k]||{};
    const body=active(v)?actsHTML(v):(k===tk?'<span class="add" aria-label="Lançar hoje">+</span>':'<span class="rest">Descanso</span>');
    return '<button type="button" class="day'+(k===tk?' today':'')+'" data-k="'+k+'"><div><div class="dn">'+d.getDate()+'</div><div class="dw">'+(k===tk?"Hoje":DW[d.getDay()])+'</div></div><div class="acts">'+body+'</div></button>'}).join("");

  /* mês */
  const y=view.getFullYear(),m=view.getMonth();
  $("mes-t").textContent=MESES[m]+(y!==t.getFullYear()?" "+y:"");
  $("m-next").disabled=(y>t.getFullYear()||(y===t.getFullYear()&&m>=t.getMonth()));
  const lead=(new Date(y,m,1).getDay()+6)%7,len=new Date(y,m+1,0).getDate();
  let h="";for(let i=0;i<lead;i++)h+='<div class="tile blank" aria-hidden="true"></div>';
  const M=[];
  for(let n=1;n<=len;n++){
    const d=new Date(y,m,n),k=key(d),v=days[k],fut=d>t;if(v)M.push(v);
    const marks=v?["inf","sup","abd"].filter(f=>v[f]).map(f=>ic(f)).join(""):"";
    h+='<button type="button" class="tile'+(fut?' future':'')+(active(v)?' done':'')+(k===tk?' today':'')+'" data-k="'+k+'"'+(fut?' disabled':'')+' aria-label="Dia '+n+'">'+
      '<span class="n">'+n+'</span>'+(marks?'<span class="marks">'+marks+'</span>':'')+'<span class="mt">'+
      (v&&v.km>0?'<span class="val">'+ic("run")+'<span class="km">'+nf(v.km)+'km</span></span>':'')+
      (v&&v.esc>0?'<span class="val">'+ic("esc")+'<span class="km">'+nf(v.esc)+'min</span></span>':'')+'</span></button>';
  }
  $("grid").innerHTML=h;
  const kmM=M.reduce((a,v)=>a+(+v.km||0),0),escM=M.reduce((a,v)=>a+(+v.esc||0),0);
  $("m-dias").textContent=M.filter(active).length;
  $("m-km").innerHTML=nf(kmM)+"<small>km</small>";
  $("m-esc").innerHTML=nf(escM)+"<small>min</small>";
  const c=f=>M.filter(v=>v[f]).length,dl=n=>n+(n===1?" dia":" dias");
  $("m-chips").innerHTML=[["inf",dl(c("inf"))],["sup",dl(c("sup"))],["abd",dl(c("abd"))],["run",dl(M.filter(v=>v.km>0).length)],["esc",dl(M.filter(v=>v.esc>0).length)]]
    .map(([f,l])=>'<span>'+ic(f,"md")+l+'</span>').join("");
}

/* abas e navegação */
function setPage(p){page=p;try{localStorage.setItem("fitness-pagina",p)}catch(e){}render()}
$("tab-sem").onclick=()=>setPage("sem");$("tab-mes").onclick=()=>setPage("mes");
$("w-prev").onclick=()=>{wStart=addDays(wStart,-7);render()};
$("w-next").onclick=()=>{wStart=addDays(wStart,7);render()};
$("m-prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("m-next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};

/* folha do dia */
function openDay(k){
  editing=k;const v=days[k]||{};
  const d=new Date(k+"T12:00:00"),tk=key(today0());
  $("sh-t").textContent=k===tk?"Hoje":k===key(addDays(today0(),-1))?"Ontem":d.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"short"});
  ["inf","sup","abd"].forEach(f=>$("tg-"+f).setAttribute("aria-pressed",String(!!v[f])));
  $("in-km").value=nf(v.km||0);$("in-esc").value=nf(v.esc||0);$("err").textContent="";
  $("sheet").classList.add("open");$("scrim").classList.add("open");$("sheet").setAttribute("aria-hidden","false");
  setTimeout(()=>$("tg-inf").focus(),50);
}
function closeDay(){$("sheet").classList.remove("open");$("scrim").classList.remove("open");$("sheet").setAttribute("aria-hidden","true");editing=null;}
const num=id=>{const v=parseFloat(String($(id).value).replace(",","."));return isFinite(v)&&v>0?Math.round(v*100)/100:0};

document.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(b&&!b.disabled)openDay(b.dataset.k)});
$("scrim").onclick=closeDay;$("close").onclick=closeDay;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editing)closeDay()});
document.querySelectorAll(".tg").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")));
document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{const id="in-"+b.dataset.f;const v=Math.max(0,Math.round((num(id)+parseFloat(b.dataset.s))*100)/100);$(id).value=nf(v);});
document.querySelectorAll(".chips").forEach(c=>c.onclick=e=>{const b=e.target.closest(".chip");if(b)$("in-"+c.dataset.f).value=b.dataset.v;});

$("sheet").addEventListener("submit",async e=>{
  e.preventDefault();if(!editing)return;
  const d={inf:$("tg-inf").getAttribute("aria-pressed")==="true",sup:$("tg-sup").getAttribute("aria-pressed")==="true",abd:$("tg-abd").getAttribute("aria-pressed")==="true",km:num("in-km"),esc:num("in-esc")};
  const k=editing,was=active(days[k]);
  $("save").disabled=true;
  try{await saveDay(k,d);}catch(err){$("err").textContent="Não salvou. Verifique a conexão e toque em Salvar de novo.";$("save").disabled=false;return;}
  $("save").disabled=false;closeDay();
  const s=streak();
  toast(active(d)?(was?"Dia atualizado":"Treino registrado · "+s+(s===1?" dia seguido":" dias seguidos")):"Dia limpo");
});

let tt;function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2400);}

/* login */
const authMsg=(t,err)=>{const m=$("authMsg");m.textContent=t;m.classList.toggle("err",!!err)};
function authError(e){const m=(e&&e.message)||"";
  if(/invalid login/i.test(m))return"E-mail ou senha incorretos.";
  if(/not confirmed/i.test(m))return"Confirme seu e-mail pelo link que enviamos e tente entrar de novo.";
  if(/already registered|already exists/i.test(m))return"Esse e-mail já tem conta. Toque em Entrar.";
  if(/password/i.test(m))return"A senha precisa ter pelo menos 6 caracteres.";
  return"Não foi possível entrar agora. Verifique a internet e tente de novo."}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();authMsg("Entrando…");
  const {data,error}=await sb.auth.signInWithPassword({email:$("authEmail").value.trim(),password:$("authPass").value});
  if(error)return authMsg(authError(error),true);authMsg("");setSession(data.session)});
$("btnSignup").addEventListener("click",async()=>{const email=$("authEmail").value.trim(),password=$("authPass").value;
  if(!email||password.length<6)return authMsg("Preencha o e-mail e uma senha com pelo menos 6 caracteres.",true);
  authMsg("Criando conta…");
  const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error)return authMsg(authError(error),true);
  if(data.session){authMsg("");setSession(data.session)}else authMsg("Conta criada. Abra o e-mail de confirmação, toque no link e volte aqui para entrar.")});
$("btnLogout").addEventListener("click",async()=>{await sb.auth.signOut();setSession(null)});

sb.auth.onAuthStateChange((_ev,s)=>{setSession(s)});
sb.auth.getSession().then(({data})=>{setSession(data.session)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)reloadSoon()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
</script>

</body>
